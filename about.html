<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Swiper Carousel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }

    .carousel-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .swiper {
      padding-bottom: 40px;
    }

    .swiper-slide {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .swiper-slide img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .swiper-button-next,
    .swiper-button-prev {
      color: black;
    }

    .swiper-pagination-bullet {
      background: black;
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="pg1.webp" alt="1" /></div>
        <div class="swiper-slide"><img src="pg2.jpg" alt="2" /></div>
        <div class="swiper-slide"><img src="pg3.jpeg" alt="3" /></div>
        <div class="swiper-slide"><img src="pg4.jpeg" alt="4" /></div>
        <div class="swiper-slide"><img src="xyz.jpg" alt="5" /></div>
      </div>

      <!-- Arrows -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>

      <!-- Dots -->
      <div class="swiper-pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      loop: true,
      autoplay: {
        delay: 3000,
        disableOnInteraction: false,
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev'
      },
      pagination: {
        el: '.swiper-pagination',
        clickable: true
      },
      spaceBetween: 30,
      slidesOffsetBefore: 20,
      slidesOffsetAfter: 20,
      breakpoints: {
        0: {
          slidesPerView: 1,
          spaceBetween: 20,
          slidesOffsetBefore: 10,
          slidesOffsetAfter: 10
        },
        768: {
          slidesPerView: 3,
          spaceBetween: 30,
          slidesOffsetBefore: 30,
          slidesOffsetAfter: 30
        }
      }
    });
  </script>

</body>
</html>
